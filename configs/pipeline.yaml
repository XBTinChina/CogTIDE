# Stage knobs + policy for the v2 peer-prediction pipeline.
# Loaded by RunContext.create() and merged into ctx.config.
#
# Stages read `ctx.config["stages"][stage_key]` with sane fallbacks, so any
# knob omitted here falls back to the DEFAULT_* constants in the stage module.

stages:
  stage_00:
    max_clarification_rounds: 5

  stage_01:
    expert_count: 19
    ideas_per_expert: 3
    challenger_rounds: 2
    challenger_chunk_size: 10

  stage_02:
    target_deep_theory_count: 15
    coalition_size: 5
    max_attempts: 25
    reviewers_per_idea: 3
    external_panel_size: 5
    # Generate up to target * pool_multiplier candidates before the
    # post-loop top-K trim ranks them by composite peer score. 1.0
    # disables trimming.
    pool_multiplier: 1.5

  stage_03:
    target_kernel_count: 5
    council_theory_size: 3
    expert_min: 5
    expert_max: 7
    max_attempts: 12
    external_panel_size: 5
    pool_multiplier: 1.5

  stage_04:
    expert_min: 5
    expert_max: 7
    revision_rounds: 2
    external_panel_size: 5
    # Three full theories with 14 detailed fields each easily exceed
    # the global 8192 max_tokens default; the schedule grows the
    # per-attempt output budget so a truncated first try can recover.
    # First-attempt budget is intentionally modest (~12k) to keep TPM
    # pressure low on rate-limited providers; we only escalate to
    # 24k/48k when the model actually truncates.
    triplet_max_tokens_schedule: [12000, 24000, 48000]
    # Plain-language explainer pass: one LLM call per kernel that
    # produces the background, analogy, and per-variant glossaries
    # used in the per-kernel markdown documents. Disable to skip.
    explainer_enabled: true
    explainer_max_tokens: 16000

batching:
  challenger_chunk_size: 10

memory:
  enabled: true
  raw_threshold_chars: 120000
  compressed_budget_chars: 24000
  topic_budget_chars: 12000
  retrieved_raw_record_limit: 3
  retrieval_min_score: 1
  per_stage:
    stage_00: true
    stage_01: false
    stage_02: {synthesis_judge: true}
    stage_03: {kernel_judge: true}
    stage_04: false

resume:
  enabled: true
  output_dir: runs
