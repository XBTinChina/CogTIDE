# Agent registry for the cogTIDE peer-prediction theory-generation pipeline.
#
# Each entry defines one agent role with its stage, substage, prompt file,
# and optional configuration. The AgentRegistry loads this file at startup.
#
# Roles include drafter, critic, judge, facilitator, constructor, reviser,
# and the peer_reviewer / external_reviewer / triplet_reviewer roles that
# drive peer-prediction scoring.

# ──────────────────────────────────────────────────────────────────────────
# Stage 0: Clarification
# ──────────────────────────────────────────────────────────────────────────
- id: S00_clarifier
  stage: stage_00
  substage: S00.01
  prompt: stage_00/AG_S00_SS04_question_clarifier.md
  role: clarifier
  output_schema: QuestionDossier

